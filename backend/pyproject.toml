[project]
name = "backend"
version = "0.1.0"
description = "Backend part of the web service for the thesis, namely for the tracker of a construction company"
authors = [
    {name = "rVladislavrr",email = "rvladislavrr@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "taskiq (>=0.12.1,<0.13.0)",
    "fastapi (>=0.135.2,<0.136.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "sqladmin[full] (>=0.23.0,<0.24.0)",
    "gunicorn (>=25.1.0,<26.0.0)",
    "alembic-postgresql-enum (>=1.10.0,<2.0.0)",
    "aiobotocore (>=3.3.0,<4.0.0)"
]
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "uvicorn (>=0.42.0,<0.43.0)"
]
